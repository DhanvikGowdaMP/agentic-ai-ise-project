
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agentic AI Travel Guide</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f5f1;
            color: #26352b;
        }

        header {
            background: #176b48;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #176b48;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5ce;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #176b48;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #176b48;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #105438;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #66736a;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌍 Agentic AI Travel Guide</h1>
        <p>Your personal assistant for planning memorable trips</p>
    </header>

    <main class="container">
        <h2>Plan Your Next Trip</h2>
        <p>Enter your preferences to start creating your travel plan.</p>

        <form action="/plan" method="POST">

            <label for="destination">Travel Destination</label>
            <input
                type="text"
                id="destination"
                name="destination"
                placeholder="e.g. Sringeri"
                required
            >

            <label for="days">Number of Days</label>
            <input
                type="number"
                id="days"
                name="days"
                min="1"
                max="30"
                placeholder="e.g. 3"
                required
            >

            <label for="budget">Total Budget (₹)</label>
            <input
                type="number"
                id="budget"
                name="budget"
                min="1"
                placeholder="e.g. 5000"
                required
            >

            <label for="interests">Travel Interests</label>
            <select id="interests" name="interests" required>
                <option value="">Select your interest</option>
                <option value="Nature">Nature and waterfalls</option>
                <option value="Temples">Temples and spirituality</option>
                <option value="Adventure">Adventure and trekking</option>
                <option value="History">History and culture</option>
                <option value="Food">Local food and cuisine</option>
                <option value="Mixed">A mix of everything</option>
            </select>

            <button type="submit">Plan My Trip</button>

        </form>
    </main>

    <footer>
        Agentic AI Travel Guide | College ISE Project
    </footer>

</body>
</html>
